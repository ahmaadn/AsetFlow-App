components:
  schemas:
    SimpleUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user
        email:
          type: string
          format: email
          description: User's email address
        role:
          type: string
          description: Role of the user in the system
      required:
        - id
        - email
        - role
