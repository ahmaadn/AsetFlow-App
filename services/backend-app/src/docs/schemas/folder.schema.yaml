components:
  schemas:
    CreateFolderItem:
      type: object
      properties:
        name:
          type: string
          description: Name of the folder
        slug:
          type: string
          description: Slug for the folder
      required:
        - name
    UpdateFolderItem:
      type: object
      properties:
        name:
          type: string
          description: Name of the folder
        slug:
          type: string
          description: Slug for the folder
      required:
        - name
    DetailFolderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the folder
        ownerId:
          type: string
          format: uuid
          description: Unique identifier for the owner of the folder
        name:
          type: string
          description: Name of the folder
        slug:
          type: string
          description: Slug for the folder
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the folder was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the folder was last updated
        assetCount:
          type: integer
          description: Number of assets contained in the folder
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the folder
      required:
        - id
        - ownerId
        - name
        - slug
        - createdAt
        - updatedAt
        - assetCount
        - tags
    PaginationFolderItem:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DetailFolderItem'
          description: List of folders in the current page
        total:
          type: integer
          description: Total number of folders available
        page:
          type: integer
          description: Current page number
        per_page:
          type: integer
          description: Number of items per page
      required:
        - items
        - total
        - page
        - per_page
  responses:
    DetailFolderResponse:
      description: Response containing detailed information about a folder
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailFolderItem'
    PaginationFolderResponse:
      description: Paginated response of folders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginationFolderItem'
  parameters:
    FolderIdParam:
      name: folderId
      in: path
      description: Unique identifier for the folder
      required: true
      schema:
        type: string
        format: uuid
    QueryFolderSortByParam:
      name: sort_by
      in: query
      description: Field to sort folders by
      required: false
      schema:
        type: string
        enum:
          - name
          - createdAt
        default: name
    QueryFolderSlugParam:
      name: folderSlug
      in: query
      description: Filter folders by slug
      required: false
      schema:
        type: string
