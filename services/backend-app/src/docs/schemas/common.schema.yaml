components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
        message:
          type: string
          description: A message providing additional information
      required:
        - success
        - message
  responses:
    SuccessResponse:
      description: Standard success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    NoContentResponse:
      description: No content to return
      content: {}
  parameters:
    QueryPageParam:
      name: page
      in: query
      description: The page number for pagination
      required: false
      schema:
        type: integer
        default: 1
    QueryPerPageParam:
      name: per_page
      in: query
      description: Number of items per page for pagination
      required: false
      schema:
        type: integer
        default: 10
    QueryOrderParam:
      name: order
      in: query
      description: The order of the results (asc or desc)
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    QuerySearchParam:
      name: search
      in: query
      description: Search term to filter results
      required: false
      schema:
        type: string
